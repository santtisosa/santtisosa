name: Generate Snake

on:
  schedule:
  - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: santtisosa
          # rojos de los guantes de Ippo
          outputs: |
            dist/snake.svg?color_snake=#ff5a3c&color_dots=#ebedf0,#ffc2c2,#ff7a7a,#e01414,#980000
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff5a3c&color_dots=#161b22,#4a0000,#7a0000,#b80000,#ff2b2b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
